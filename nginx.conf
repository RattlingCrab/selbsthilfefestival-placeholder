server {
    listen       80;
    listen       [::]:80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ---------------------------------------------------------------
    # Sicherheits-Header
    # ---------------------------------------------------------------
    # Die Seite laedt nichts von fremden Servern: Schriften und Bilder
    # liegen lokal, Karten werden nur verlinkt. Deshalb kann die CSP
    # eng bleiben. 'unsafe-inline' fuer style-src ist noetig, weil einige
    # Strangfarben als style-Attribut gesetzt sind.
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; form-action 'self'; frame-ancestors 'none'; base-uri 'self'" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy        "geolocation=(), microphone=(), camera=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    # ---------------------------------------------------------------
    # Kompression
    # ---------------------------------------------------------------
    gzip              on;
    gzip_vary         on;
    gzip_min_length   512;
    gzip_comp_level   6;
    gzip_types        text/plain text/css text/javascript application/javascript
                      application/json image/svg+xml application/ld+json;

    # ---------------------------------------------------------------
    # Health-Check: immer offen, auch bei aktivem Passwortschutz.
    # Muss VOR dem geschuetzten location-Block stehen.
    # ---------------------------------------------------------------
    location = /healthz {
        auth_basic off;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------------
    # Zwischenspeicherung
    # ---------------------------------------------------------------
    # Schriften und Bilder aendern sich praktisch nie und tragen beim
    # Wechsel einen neuen Namen -> lange Frist.
    location /assets/ {
        include /etc/nginx/schutz.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # CSS und JS aendern sich mit jedem Release. Kurze Frist plus
    # Revalidierung, damit ein Deploy sofort ankommt.
    location ~* \.(css|js)$ {
        include /etc/nginx/schutz.conf;
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # HTML nie zwischenspeichern -> Inhaltsaenderungen sind sofort da.
    location = /index.html {
        include /etc/nginx/schutz.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # robots.txt wird beim Start je nach Schutzstatus geschrieben und
    # bleibt offen, damit Suchmaschinen sie ueberhaupt lesen koennen.
    location = /robots.txt {
        auth_basic off;
        access_log off;
    }

    # Einzelne Seite: alles Unbekannte landet auf der Startseite.
    location / {
        include /etc/nginx/schutz.conf;
        try_files $uri $uri/ /index.html;
    }

    # Versteckte Dateien nicht ausliefern.
    location ~ /\. {
        deny all;
    }
}
