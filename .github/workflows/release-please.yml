name: Release Please

# Beobachtet main und öffnet einen Release-PR, sobald Commits mit
# Conventional-Commits-Prefix (feat:, fix:, feat!:) dazugekommen sind.
# Nach dem Merge dieses PRs:
#   1. release-please legt den Tag v<major>.<minor>.<patch> an
#   2. build-and-push.yml reagiert auf den Tag, baut das Image und
#      löst den Rollout aus

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
